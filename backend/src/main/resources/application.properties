spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_personas?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:personas_app}
spring.datasource.password=${DB_PASSWORD}

# La preparación del esquema se realiza por separado, con permisos propios.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:personas_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:5000}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=1

app.rabbitmq.publisher-confirm-timeout=${RABBITMQ_CONFIRM_TIMEOUT:5000}
app.rabbitmq.retry.max-attempts=${MYSQL_RETRY_MAX_ATTEMPTS:3}
app.rabbitmq.retry.initial-interval=${MYSQL_RETRY_INITIAL_INTERVAL:1000}
app.rabbitmq.retry.multiplier=${MYSQL_RETRY_MULTIPLIER:2.0}
app.rabbitmq.retry.max-interval=${MYSQL_RETRY_MAX_INTERVAL:5000}
